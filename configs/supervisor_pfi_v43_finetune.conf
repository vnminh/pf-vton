[program:pfi-v43-1024]
directory=/workspace/patch-forcing-vton
command=/bin/bash /workspace/patch-forcing-vton/scripts/run_pfi_v43_finetune.sh
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/workspace/patch-forcing-vton"
autostart=false
autorestart=false
exitcodes=0
startsecs=20
startretries=0
stopsignal=INT
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/workspace/patch-forcing-vton/logs/vton-v43-pfi-1024-24gb.log
stdout_logfile_maxbytes=0
