[program:pfi-v41-full-audit]
command=/bin/bash /workspace/patch-forcing-vton/scripts/run_pfi_v41_full_audit.sh
directory=/workspace/patch-forcing-vton
user=root
autostart=true
autorestart=false
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/patch-forcing-vton/logs/vton-v41-pfi-detail/full-audit-supervisor.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=2
stderr_logfile=/workspace/patch-forcing-vton/logs/vton-v41-pfi-detail/full-audit-supervisor.err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=2
