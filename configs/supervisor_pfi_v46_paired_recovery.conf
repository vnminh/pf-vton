[program:pfi-v46-paired-recovery]
directory=/workspace/pfi-resume-audit/code
command=/bin/bash /workspace/pfi-resume-audit/code/scripts/run_pfi_v46_paired_recovery.sh
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/workspace/pfi-resume-audit/code"
autostart=false
autorestart=unexpected
exitcodes=0
startsecs=120
startretries=0
stopsignal=INT
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/workspace/patch-forcing-vton/logs/vton-v46-pfi-1024-paired-recovery.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=1
