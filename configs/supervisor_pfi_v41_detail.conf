; Server-specific process management for the bounded V41 training pilot.
[program:pfi-v41-detail]
directory=/workspace/patch-forcing-vton
command=/bin/bash /workspace/patch-forcing-vton/scripts/run_pfi_v41_detail.sh
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/workspace/patch-forcing-vton"
autostart=false
autorestart=unexpected
exitcodes=0
startsecs=20
startretries=1
stopsignal=INT
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/workspace/patch-forcing-vton/logs/vton-v41-pfi-detail.log
stdout_logfile_maxbytes=0
