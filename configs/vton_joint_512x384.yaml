seed: 42

weights:
  pft: checkpoints/pft-xl_step400k_ema.ckpt
  vae: checkpoints/sd_ae.ckpt
  dino: checkpoints/dinov3-vits16-pretrain-lvd1689m

data:
  root: ../high-resolution-viton-zalando-dataset
  # Generated once with scripts/make_vton_dev_split.py. Model selection uses
  # train/dev only; the official test set remains untouched until final report.
  pairs_file: ${data.root}/train_fit_pairs.txt
  test_pairs_file: ${data.root}/train_dev_pairs.txt
  official_paired_pairs_file: ${data.root}/test_pairs_paired.txt
  official_unpaired_pairs_file: ${data.root}/test_pairs.txt
  test_order: paired
  require_cloth_mask: true
  require_parse: true
  clothing_labels: [5, 6, 7]
  num_workers: 8

model:
  image_hw: [512, 384]
  latent_hw: [64, 48]
  patch_size: 2
  garment_patch_size: 1
  # Sparse set of native-resolution detail injections. Global correspondence is
  # still learned by the all-block joint stream below.
  cross_blocks: [12, 20, 27]
  # Supervise every native-resolution adapter. Leaving the early adapters
  # diffuse lets them mix sleeve/body/logo values before a sharp final read.
  coral_blocks: [12, 20, 27]
  qk_norm: true
  cross_logit_scale: 10.0
  cross_init_gate: 0.10

  # V8: clean unwarped garment patches share the pretrained self-attention
  # stream with person patches in every one of the 28 DiT blocks.
  joint_garment_tokens: true
  joint_attention_blocks: [24]
  joint_highres_cross_attention: true

  # Final cross-attention selects one local source RGB patch per output latent.
  # A zero-output CNN converts that patch in target context and adds only a
  # confidence-gated velocity residual. No garment feature becomes x0.
  # Fixed-gate ablation showed every positive raw-latent blend degraded both
  # paired and identity reconstruction. Keep this rejected route disabled.
  # A dedicated single-purpose router receives CORAL supervision. It predicts
  # only source coordinates; generative value attention is no longer forced to
  # make all 16 heads imitate one DINO match.
  attention_transport: true
  attention_transport_block: 27
  attention_transport_init_gate: 1.0
  dedicated_router: true
  router_dim: 64

  # One native-latent query for each of the four subpixels emitted by a person
  # token. Unlike raw-latent transport, this is a learned zero-init velocity
  # residual, so the generator can reject incorrect source locations.
  # Disabled after the V15 gate: extra unsupervised subpixel capacity mirrored
  # the baseline and made identity lettering scratchier. The entropy-gated local
  # retrieval above is both cheaper and tied to supervised correspondence.
  final_detail_attention: false
  final_detail_dim: 256
  final_detail_heads: 8

  # Completely disable every warp-derived path. These are kept as constructor
  # fields only so older checkpoints/configs remain loadable.
  use_dense_transport: false
  transport_mask_aligned_base: false
  transport_geometry_only: false
  transport_learned_residual: false
  transport_max_offset: 0.0
  transport_fixed_gate: 0.0
  transport_blocks: []
  transport_block_gate: 0.0
  transport_output_scale: 0.0
  cross_attention_scale: 1.0
  source_condition_scale: 0.0

flow:
  # True Gaussian-noise endpoint. No garment geometry or pixels are copied into
  # x0; all garment evidence comes from the clean joint token stream.
  start_from_warp: false
  # Kept explicit so checkpoint evaluation can compare Euler against Heun.
  solver: euler
  ltg_std: 0.6
  ltg_loc: 0.7
  ltg_scale: 1.0
  synchronous_probability: 1.0
  synchronous_uniform: true
  synchronous_detail: true
  # Exact t=0 examples prevent the denoiser from using visible GT pixels at
  # high t instead of learning the garment condition.
  pure_noise_probability: 0.50
  detail_refine_probability: 0.10
  detail_time_range: [0.78, 0.98]
  grounding_steps: 1000
  grounding_pure_noise_probability: 0.70
  grounding_detail_refine_probability: 0.10
  # Ignored when start_from_warp=false; retained for old sampler compatibility.
  source_noise_std: 0.0
  source_confidence_erode_px: 4

coral:
  # A coarse training-only correspondence route selects where to read; the
  # 64x48 VAE values carry the actual lettering and color payload. Diffusion
  # still starts from Gaussian noise and no warped garment is used at inference.
  weight: 1.00
  entropy_weight: 0.02
  gaussian_sigma: 0.015
  transport_weight: 0.0
  min_similarity: 0.20
  cycle_radius: 0.10
  detail_edge_boost: 1.0

loss:
  uncertainty_weight: 0.01
  edge_flow_boost: 1.5
  clothing_boost: 3.0
  # Label-free exact-copy auxiliary: reconstruct the clean reference garment
  # on a blank canvas from noise. This breaks the one-person/one-garment
  # shortcut without using a warp or changing inference inputs.
  garment_identity_probability: 0.20
  # Label-free counterfactual colorways: apply the same random pointwise RGB
  # map to shop garment and worn-clothing pixels. This breaks the paired-data
  # person/color shortcut without creating a spatial warp or pseudo target.
  # Kept available for ablation, but disabled: the V14 gate reduced garment
  # sensitivity and regressed paired L1 without a visible transfer gain.
  appearance_counterfactual_probability: 0.0
  appearance_counterfactual_strength: 0.85
  # Require clothing queries to use garment tokens, without inventing a spatial
  # correspondence target that is absent from the dataset.
  joint_attention_weight: 0.05
  joint_attention_minimum_mass: 0.35
  # Endpoint/detail objectives train block colors and small graphics directly.
  decoded_probability: 0.50
  decoded_pure_only: false
  decoded_latent_weight: 1.00
  decoded_rgb_weight: 0.30
  decoded_edge_weight: 0.20
  decoded_laplacian_weight: 0.20
  decoded_color_weight: 0.30
  decoded_time_floor: 0.10
  transport_latent_weight: 0.0
  transport_smoothness_weight: 0.0
  transport_offset_weight: 0.0
  transport_rgb_weight: 0.0
  transport_edge_weight: 0.0
  transport_laplacian_weight: 0.0
  transport_color_weight: 0.0

optim:
  lr: 1.0e-4
  weight_decay: 0.01
  pretrained_lr_multiplier: 0.25
  # Tune qkv/proj, MLP and adaLN in all 28 blocks. Base PFT parameters remain
  # frozen; this is not restricted to the last blocks.
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.0
  lora_include_adaln: true
  lora_lr: 5.0e-5
  lora_weight_decay: 0.0
  reset_final_output_on_load: false
  reset_transport_flow_output_on_load: false
  reset_transport_geometry_input_on_load: false
  # Available V5/V7 checkpoints are warp-contaminated. Reuse only the generic
  # pose/agnostic projection; do not import their velocity head or LoRA deltas.
  load_include_prefixes: [person_condition_embedder]
  clip_grad_norm: 1.0
  warmup_steps: 100
  min_lr_ratio: 0.10
  # V17 full-attention gate caused rapid forgetting (identity L1 0.111->0.163).
  # Keep the pretrained backbone protected and adapt all blocks through LoRA.
  train_self_attention: false
  self_attention_blocks: []
  train_final_layer: true
  train_source_condition: false
  train_garment_embedder: true
  train_cross_attention: true
  train_transport_flow: false
  train_transport_features: false
  train_transport_output: false

train:
  # Two samples per microbatch with accumulation 16 gives effective batch 32.
  batch_size: 2
  gradient_accumulation_steps: 16
  mixed_precision: bf16
  max_steps: 12000
  log_every: 10
  # Small V8 deltas are ~100 MB including optimizer state. Save often enough to
  # select on the development split and detect late overfitting.
  save_every: 500
  tensorboard: true
  preview_every: 250
  # The controlled solver benchmark found one-step endpoint prediction far
  # better than repeated integration (L1 0.0767 vs 0.1459 at 50 steps).
  preview_steps: 1
  preview_num_samples: 2
  preview_seed: 12345
  preview_phase: train
  preview_order: paired
  preview_at_start: true
  output_dir: logs/vton-v18-router-paper
