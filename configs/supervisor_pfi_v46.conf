[program:pfi-v46-c2f]
directory=/workspace/patch-forcing-vton
command=/bin/bash /workspace/patch-forcing-vton/scripts/run_pfi_v46.sh
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/workspace/patch-forcing-vton"
autostart=false
; Resume from latest.pt after a crash; a clean exit at max_steps stays stopped.
autorestart=unexpected
exitcodes=0
startsecs=120
startretries=3
stopsignal=INT
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/workspace/patch-forcing-vton/logs/vton-v46-pfi-1024-c2f.log
stdout_logfile_maxbytes=200MB
stdout_logfile_backups=1
