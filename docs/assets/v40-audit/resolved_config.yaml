seed: 42
weights:
  pft: checkpoints/pft-xl_step400k_ema.ckpt
  vae: checkpoints/sd_ae.ckpt
  dino: checkpoints/dinov3-vits16-pretrain-lvd1689m
data:
  root: ../high-resolution-viton-zalando-dataset
  pairs_file: ${data.root}/train_fit_pairs.txt
  test_pairs_file: ${data.root}/train_dev_pairs.txt
  official_paired_pairs_file: ${data.root}/test_pairs_paired.txt
  official_unpaired_pairs_file: ${data.root}/test_pairs.txt
  clothing_labels:
  - 5
  - 6
  - 7
  num_workers: 8
  augment: true
  person_translate_fraction: 0.03
  person_scale_range:
  - 0.96
  - 1.04
  garment_translate_fraction: 0.05
  garment_scale_range:
  - 0.94
  - 1.06
  mask_open_px_range:
  - 0
  - 12
model:
  image_hw:
  - 512
  - 384
  latent_hw:
  - 64
  - 48
  patch_size: 2
  coral_blocks:
  - 8
  - 12
  - 16
  - 20
  coral_heads: 4
flow:
  ltg_std: 0.6
  ltg_loc: 0.0
  ltg_scale: 1.0
  curriculum:
    start:
      pure_noise: 0.5
      synchronous: 0.2
      detail: 0.0
    end:
      pure_noise: 0.1
      synchronous: 0.15
      detail: 0.4
    detail_range:
    - 0.7
    - 0.98
    gate_metric: coral_local_mass
    gate_threshold: 0.3
    gate_min_steps: 1500
    gate_max_steps: 6000
    ramp_steps: 3000
  garment_dropout: 0.1
coral:
  weight: 0.1
  entropy_weight: 0.01
  gaussian_sigma: 0.04
  min_similarity: 0.2
  cycle_radius: 0.1
loss:
  uncertainty_weight: 0.01
  clothing_boost: 1.0
optim:
  lr: 0.0001
  pretrained_lr_multiplier: 0.2
  weight_decay: 0.0
  warmup_steps: 500
  min_lr_ratio: 0.1
  clip_grad_norm: 1.0
train:
  batch_size: 4
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  max_steps: 20000
  ema_decay: 0.0
  ema_start: 500
  log_every: 10
  save_every: 250
  keep_every: 2500
  output_dir: logs/vton-v40-pfi-coral
eval:
  every: 500
  at_start: false
  seed: 12345
  batch_size: 4
  indices:
  - 23
  - 65
  - 44
  - 115
  - 163
  - 232
  - 93
  - 152
  mask_open_px: 6
  p: 0.7
  n_inner: 2
  samplers:
  - name: euler
    nfe: 8
  - name: dual_loop
    nfe: 8
  - name: euler
    nfe: 25
